<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101e2a">
  <meta name="description" content="星间来信，一段穿越星球、学会照顾与告别的非商业 3D 短篇试玩。">
  <title>星间来信 · Star Letters</title>
  <link rel="icon" href="TemplateData/star.svg" type="image/svg+xml">
  <link rel="stylesheet" href="TemplateData/style.css?v=footstep-20261019">
</head>
<body data-release="footstep-20261019">
  <main class="journey">
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="星间来信首页"><span class="mark" aria-hidden="true">✦</span><span>星间来信<small>STAR LETTERS</small></span></a>
      <span class="edition">一段约 10 分钟的星际短篇</span>
    </header>

    <section id="unity-fullscreen-container" class="viewport" aria-label="星间来信游戏">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="游戏画面，点击后用 WASD 或方向键移动"></canvas>
      <div class="loading" id="loading">
        <div class="constellation" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><span>✦</span></div>
        <p class="eyebrow">STAR LETTERS</p>
        <h1>星间来信</h1>
        <p class="intro">有些答案，要走过几颗星星才会明白。</p>
        <div class="progress" role="progressbar" aria-label="游戏加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
        <p class="status" id="loading-status" role="status">正在准备启程… <span id="progress-text">0%</span></p>
        <p class="load-note">首次加载需要下载游戏，请稍候。</p>
      </div>
      <aside class="notice" id="notice" hidden role="alert"><h2 id="notice-title">暂时无法启程</h2><p id="notice-message"></p><button type="button" id="retry">重新加载</button></aside>
      <div class="focus-hint" id="focus-hint" hidden>点击画面，开始你的旅程</div>
      <div class="audio-controls" id="audio-controls" hidden role="group" aria-label="声音设置">
        <button type="button" id="audio-mute" aria-label="静音" aria-pressed="false" title="静音"><span aria-hidden="true">♪</span><span id="audio-label">声音</span></button>
        <label class="visually-hidden" for="audio-volume">音量</label>
        <input id="audio-volume" type="range" min="0" max="100" step="1" value="65" aria-label="音量">
        <output id="audio-value" for="audio-volume">65%</output>
        <span class="audio-hint" id="audio-hint">开始旅程后播放音乐</span>
      </div>
      <button class="fullscreen" type="button" id="fullscreen" disabled aria-label="全屏游戏" title="全屏">⛶<span>全屏</span></button>
    </section>

    <footer class="footer">
      <p class="controls"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键 移动</span><span><kbd>E</kbd> 交互</span><span><kbd>Space</kbd> / <kbd>Enter</kbd> 继续</span><span><kbd>Esc</kbd> 暂停</span></p>
      <p class="desktop-note">推荐电脑 + 键盘体验 <span aria-hidden="true">·</span> 非商业试玩</p>
    </footer>
    <p class="mobile-note">这段旅程使用键盘操作。请在电脑浏览器中打开，获得完整体验。</p>
    <div id="story-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  </main>
  <script src="TemplateData/audio-controls.js?v=footstep-20261019"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const fill = document.getElementById('progress-fill');
    const progress = document.querySelector('[role="progressbar"]');
    const progressText = document.getElementById('progress-text');
    const status = document.getElementById('loading-status');
    const notice = document.getElementById('notice');
    const noticeTitle = document.getElementById('notice-title');
    const noticeMessage = document.getElementById('notice-message');
    const focusHint = document.getElementById('focus-hint');
    const fullscreen = document.getElementById('fullscreen');
    let unityInstance;
    let failed = false;

    function showError(message) {
      failed = true;
      loading.hidden = true;
      focusHint.hidden = true;
      document.getElementById('audio-controls').hidden = true;
      notice.hidden = false;
      noticeTitle.textContent = '暂时无法启程';
      noticeMessage.textContent = message;
      document.body.dataset.gameState = 'error';
    }
    document.getElementById('retry').addEventListener('click', () => location.reload());
    canvas.addEventListener('pointerdown', () => { canvas.focus(); focusHint.hidden = true; });
    canvas.addEventListener('focus', () => { focusHint.hidden = true; });
    canvas.addEventListener('blur', () => { if (unityInstance && !failed) focusHint.hidden = false; });
    canvas.addEventListener('keydown', event => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
    });
    fullscreen.addEventListener('click', () => {
      if (unityInstance) { unityInstance.SetFullscreen(1); canvas.focus(); }
    });

    const config = {
      arguments: [],
      dataUrl: 'Build/ad0f366d9ba6b61f4f4e99ffd6bdb50c.data.unityweb',
      frameworkUrl: 'Build/11c78c80943d0b78fbd116eaedfedd46.framework.js.unityweb',
      codeUrl: 'Build/7c38bbb554d06cb8f251caece0eef3ec.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Local Prototype",
      productName: "Little Island",
      productVersion: "0.1.0",
      fullscreenElementID: 'unity-fullscreen-container',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      autoSyncPersistentDataPath: true,
      showBanner: (message, type) => {
        if (type === 'error') showError('游戏运行遇到问题：' + message);
        else console.warn('[Star Letters]', message);
      }
    };

    if (location.protocol === 'file:') {
      showError('请通过网站地址打开游戏，或使用 HTTP 本地预览；直接双击 HTML 无法加载 Unity 游戏。');
    } else if (!window.WebAssembly || !document.createElement('canvas').getContext('webgl2')) {
      showError('浏览器未能启用 WebGL 2。请使用新版 Chrome、Edge、Firefox 或 Safari，并在浏览器设置中开启硬件加速。');
    } else {
      const script = document.createElement('script');
      script.src = 'Build/3b87e00b86a76a9b8aba2c6e3bb4c5f6.loader.js';
      script.onerror = () => showError('未能下载游戏启动文件。请检查网络连接，再重新加载。');
      script.onload = () => {
        createUnityInstance(canvas, config, value => {
          const amount = Math.max(0, Math.min(100, Math.round(value * 100)));
          fill.style.width = amount + '%';
          progress.setAttribute('aria-valuenow', amount);
          progressText.textContent = amount + '%';
          if (amount === 100) status.firstChild.textContent = '正在唤醒星星… ';
        }).then(instance => {
          unityInstance = instance;
          window.unityInstance = instance;
          if (failed) return;
          loading.hidden = true;
          fullscreen.disabled = false;
          focusHint.hidden = false;
          document.body.dataset.gameState = 'ready';
        }).catch(error => showError('游戏未能启动：' + String(error)));
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
